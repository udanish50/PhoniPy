name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip certifi
      - run: python -m pip install -e '.[test,app]'
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, phonipy; assert os.environ['RELEASE_TAG'] == 'v' + phonipy.__version__"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
