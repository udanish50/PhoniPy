[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "phonipy"
version = "0.2.0"
description = "Reproducible musical-note stability and harmonic-purity analysis of voice recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muhammad Umair Danish"}]
keywords = ["voice", "phonation", "music-therapy", "audio", "pitch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
plot = ["matplotlib>=3.7"]
app = []
table = ["pandas>=2"]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2", "twine>=6", "openpyxl>=3.1", "matplotlib>=3.7", "pandas>=2"]
benchmark = ["wfdb>=4.1", "certifi>=2026.10.19"]

[project.scripts]
phonipy = "phonipy.cli:main"

[project.urls]
Homepage = "https://github.com/udanish50/PhoniPy"
Issues = "https://github.com/udanish50/PhoniPy/issues"

[tool.hatch.build.targets.wheel]
packages = ["phonipy"]

[tool.hatch.build.targets.sdist]
include = ["phonipy", "tests", "docs", "README.md", "LICENSE", "pyproject.toml", ".github"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
